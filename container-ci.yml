name: Container CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-build-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Backend tests and package
        run: ./mvnw test package

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/main/resources/static/package-lock.json

      - name: Frontend tests and build
        working-directory: src/main/resources/static
        run: |
          npm ci
          npm test -- --run
          npm run build

      - name: Validate Docker Compose config
        run: docker compose config

      - name: Build Docker images
        run: docker compose build

      - name: Smoke test containers
        run: |
          docker compose up -d
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1/health && curl -fsS http://127.0.0.1/main/health-check; then
              docker compose ps
              exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1

      - name: Stop containers
        if: always()
        run: docker compose down -v

      - name: Login to Docker Hub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker images
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          docker tag fullstack2-backend:local ${{ secrets.DOCKERHUB_USERNAME }}/fullstack2-backend:latest
          docker tag fullstack2-frontend:local ${{ secrets.DOCKERHUB_USERNAME }}/fullstack2-frontend:latest

      - name: Push Docker images
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/fullstack2-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/fullstack2-frontend:latest