spring.application.name=fullstack2

server.port=${SERVER_PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5441/admin}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
#spring.jackson.serialization.fail-on-empty-beans=false

spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.datasource.driver-class-name=org.postgresql.Driver

jwt.secret=${JWT_SECRET:dev-only-change-me-with-a-long-random-secret}
jwt.access-expiration-time=${JWT_ACCESS_EXPIRATION_TIME:1800000}
jwt.refresh-expiration-time=${JWT_REFRESH_EXPIRATION_TIME:604800000}
security.enabled=${SECURITY_ENABLED:false}

spring.web.resources.add-mappings=true

storage.s3.endpoint=${STORAGE_S3_ENDPOINT:http://127.0.0.1:9100}
storage.s3.region=${STORAGE_S3_REGION:us-east-1}
storage.s3.access-key=${STORAGE_S3_ACCESS_KEY:admin}
storage.s3.secret-key=${STORAGE_S3_SECRET_KEY:adminadmin}
storage.s3.bucket=${STORAGE_S3_BUCKET:schedule-files}
storage.s3.max-file-size-bytes=${STORAGE_S3_MAX_FILE_SIZE_BYTES:5242880}
storage.s3.allowed-content-types=${STORAGE_S3_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,application/pdf,text/plain}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.seo.base-url=${APP_BASE_URL:http://localhost:8080}

weather.api.enabled=${WEATHER_API_ENABLED:true}
weather.api.base-url=${WEATHER_API_BASE_URL:https://api.open-meteo.com/v1/forecast}
weather.api.default-city=${WEATHER_DEFAULT_CITY:Москва}
weather.api.timeout-seconds=${WEATHER_API_TIMEOUT_SECONDS:4}
weather.api.max-retries=${WEATHER_API_MAX_RETRIES:2}
weather.api.cache-minutes=${WEATHER_API_CACHE_MINUTES:10}
weather.api.min-request-interval-seconds=${WEATHER_API_MIN_REQUEST_INTERVAL_SECONDS:30}
