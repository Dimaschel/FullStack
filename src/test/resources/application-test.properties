spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
jwt.secret=test-secret-key-test-secret-key-1234567890
jwt.access-expiration-time=3600000
jwt.refresh-expiration-time=86400000
weather.api.enabled=false
app.seo.base-url=http://localhost:8080
storage.s3.bucket=test-bucket
storage.s3.max-file-size-bytes=5242880
storage.s3.allowed-content-types=image/jpeg,image/png,application/pdf,text/plain
